name: lockfile-update

on:
  # Normal behavior:
  # Re-resolve the canonical environment after source changes and report drift.
  push:
    branches:
      - main
    paths:
      - environment.yml
      - scripts/generate-lockfile.sh
      - .github/workflows/lockfile-update.yml

  # Weekly monitoring:
  # Freshly resolve the environment and report lockfile drift.
  schedule:
    - cron: "17 10 * * 1"

  # Manual execution:
  # Allows resolution and drift inspection without a source change.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockfile-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure runtime paths
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "CANDIDATE_LOCK=${RUNNER_TEMP}/candidate-conda-lock.yml" \
            >> "${GITHUB_ENV}"

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: "2.8.1-0"
          cache-downloads: true

      - name: Install conda-lock
        shell: bash
        run: |
          set -Eeuo pipefail

          micromamba install \
            -y \
            -n base \
            -c conda-forge \
            "conda-lock=3.0.4"

      - name: Show solver versions
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Trigger: ${GITHUB_EVENT_NAME}"
          echo "MAMBA_EXE=${MAMBA_EXE}"

          "${MAMBA_EXE}" --version
          "${MAMBA_EXE}" run -n base conda-lock --version

      - name: Generate candidate lock
        id: generate
        continue-on-error: true
        shell: bash
        env:
          CONDA_LOCK_SUBPROCESS_STDERR_LOG_LEVEL_OVERRIDE: INFO
        run: |
          set -Eeuo pipefail

          bash scripts/generate-lockfile.sh "${CANDIDATE_LOCK}"

      - name: Report solve failure
        if: steps.generate.outcome != 'success'
        shell: bash
        run: |
          {
            echo "## Lockfile generation failed"
            echo
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
            echo "- The multi-platform environment could not be resolved."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "::error::Lockfile generation failed."

      - name: Report lockfile drift
        if: steps.generate.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "## Lockfile drift"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ ! -f conda-lock.yml ]]; then
            {
              echo "**Drift detected:** yes"
              echo
              echo "No committed canonical lockfile currently exists."
            } >> "${GITHUB_STEP_SUMMARY}"

            echo "::warning::No committed conda-lock.yml exists."

          elif ! cmp -s conda-lock.yml "${CANDIDATE_LOCK}"; then
            {
              echo "**Drift detected:** yes"
              echo
              echo "A fresh dependency solve differs from the committed lockfile."
              echo "The candidate lock is available as a workflow artifact."
              echo "Update the canonical lock on a branch and merge it through the normal pull-request checks."
            } >> "${GITHUB_STEP_SUMMARY}"

            echo "::warning::A fresh dependency solve produced lockfile drift."
            diff --brief conda-lock.yml "${CANDIDATE_LOCK}" || true

          else
            {
              echo "**Drift detected:** no"
              echo
              echo "The fresh dependency solve matches the committed lockfile."
            } >> "${GITHUB_STEP_SUMMARY}"

            echo "Fresh solve matches the committed lockfile."
          fi

      - name: Upload candidate lock
        if: steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: candidate-conda-lock-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-conda-lock.yml
          if-no-files-found: error
          retention-days: 14

      - name: Report read-only maintenance behavior
        if: steps.generate.outcome == 'success'
        shell: bash
        run: |
          {
            echo
            echo "## Maintenance behavior"
            echo
            echo "This workflow is read-only with respect to the repository."
            echo "It never commits or pushes directly to \`main\`."
            echo "Any canonical lockfile update must be proposed and validated in a pull request."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail workflow if lockfile generation failed
        if: steps.generate.outcome != 'success'
        shell: bash
        run: |
          echo "Lockfile generation failed."
          exit 1
