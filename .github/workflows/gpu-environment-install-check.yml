name: gpu-environment-install-check

on:
  pull_request:
    paths:
      - environment-gpu.yml
      - conda-lock-gpu.yml
      - scripts/generate-gpu-lockfile.sh
      - scripts/smoke_test.py
      - scripts/gpu_smoke_test.py
      - .github/workflows/gpu-environment-install-check.yml

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-environment-install-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure runtime paths
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "CANDIDATE_LOCK=${RUNNER_TEMP}/candidate-conda-lock-gpu.yml" >> "${GITHUB_ENV}"

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: "2.8.1-0"
          cache-downloads: true

      - name: Install conda-lock
        shell: bash
        run: |
          set -Eeuo pipefail
          micromamba install \
            -y \
            -n base \
            -c conda-forge \
            "conda-lock=3.0.4"

      - name: Generate GPU lock
        shell: bash
        env:
          CONDA_LOCK_SUBPROCESS_STDERR_LOG_LEVEL_OVERRIDE: INFO
        run: |
          set -Eeuo pipefail
          bash scripts/generate-gpu-lockfile.sh "${CANDIDATE_LOCK}"

      - name: Install GPU environment from lock
        shell: bash
        run: |
          set -Eeuo pipefail
          conda-lock install \
            --conda "${MAMBA_EXE}" \
            --name ai-research-env-gpu \
            "${CANDIDATE_LOCK}"

      - name: Validate Python dependency consistency
        shell: bash
        run: |
          set -Eeuo pipefail
          micromamba run -n ai-research-env-gpu python -m pip check

      - name: Run general environment smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          micromamba run -n ai-research-env-gpu python scripts/smoke_test.py

      - name: Validate CUDA-enabled PyTorch build
        shell: bash
        run: |
          set -Eeuo pipefail
          micromamba run -n ai-research-env-gpu python scripts/gpu_smoke_test.py
