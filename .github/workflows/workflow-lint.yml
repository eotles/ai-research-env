name: workflow-lint

on:
  # This workflow is intentionally unfiltered for pull requests so it can be
  # configured as an always-present required status check on main.
  pull_request:

  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "AGENTS.md"
      - "README.md"
      - "Dockerfile*"
      - "environment.yml"
      - "environment-gpu.yml"
      - "conda-lock.yml"
      - "conda-lock-gpu.yml"
      - "scripts/**"
      - "config/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check repository protocol
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_repo_protocol.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

      - name: Check static repository protocol
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_repo_protocol.py

      - name: Install ShellCheck
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install actionlint
        shell: bash
        run: |
          set -Eeuo pipefail

          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          set -Eeuo pipefail

          actionlint -color

      - name: Lint repository shell scripts
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -d '' shell_files < <(
            find scripts \
              -type f \
              -name "*.sh" \
              -print0
          )

          if [[ "${#shell_files[@]}" -eq 0 ]]; then
            echo "No shell scripts found."
            exit 0
          fi

          shellcheck "${shell_files[@]}"

      - name: Check Python script syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m compileall -q scripts config
