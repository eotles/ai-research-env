name: gpu-lockfile-check

on:
  pull_request:
    paths:
      - environment-gpu.yml
      - conda-lock-gpu.yml
      - scripts/generate-gpu-lockfile.sh
      - .github/workflows/gpu-lockfile-check.yml

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-lockfile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure runtime paths
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "CANDIDATE_LOCK=${GITHUB_WORKSPACE}/candidate-conda-lock-gpu.yml" \
            >> "${GITHUB_ENV}"

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: "2.8.1-0"
          cache-downloads: true

      - name: Install conda-lock
        shell: bash
        run: |
          set -Eeuo pipefail
          micromamba install \
            -y \
            -n base \
            -c conda-forge \
            "conda-lock=3.0.4"

      - name: Generate candidate GPU lock
        shell: bash
        env:
          CONDA_LOCK_SUBPROCESS_STDERR_LOG_LEVEL_OVERRIDE: INFO
        run: |
          set -Eeuo pipefail
          bash scripts/generate-gpu-lockfile.sh "${CANDIDATE_LOCK}"

      - name: Validate CUDA packages in candidate lock
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F "name: pytorch-cuda" "${CANDIDATE_LOCK}"
          grep -F "version: '12.4'" "${CANDIDATE_LOCK}" || \
            grep -F 'version: "12.4"' "${CANDIDATE_LOCK}" || \
            grep -F "version: 12.4" "${CANDIDATE_LOCK}"

      - name: Compare canonical GPU lock
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f conda-lock-gpu.yml ]]; then
            echo "::error::conda-lock-gpu.yml is missing."
            exit 1
          fi

          # Older canonical locks may contain generation-directory paths in
          # instructional comments and metadata.sources. Normalize both files
          # before comparison so CI checks dependency/package drift, not legacy
          # path spelling. New generator output is already canonicalized.
          python - conda-lock-gpu.yml "${CANDIDATE_LOCK}" <<'PY'
          from pathlib import Path
          import re
          import sys

          def normalize(path: Path) -> str:
              text = path.read_text()
              text = re.sub(
                  r"(?m)^  sources:\n(?:  - .*\n)+",
                  "  sources:\n  - environment-gpu.yml\n",
                  text,
                  count=1,
              )
              text = re.sub(
                  r"(?m)^#     conda-lock -f .*environment-gpu\.yml --lockfile conda-lock-gpu\.yml$",
                  "#     conda-lock -f environment-gpu.yml --lockfile conda-lock-gpu.yml",
                  text,
              )
              text = re.sub(
                  r"\.conda-lock-gpu\.tmp\.[A-Za-z0-9]+\.yml",
                  "conda-lock-gpu.yml",
                  text,
              )
              return text

          canonical = normalize(Path(sys.argv[1]))
          candidate = normalize(Path(sys.argv[2]))
          if canonical != candidate:
              raise SystemExit("GPU lockfile dependency/package drift detected")
          PY

          echo "GPU dependency/package lock matches conda-lock-gpu.yml."

      - name: Upload candidate GPU lock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-conda-lock-gpu-${{ github.run_id }}
          path: ${{ github.workspace }}/candidate-conda-lock-gpu.yml
          if-no-files-found: ignore
          retention-days: 14
