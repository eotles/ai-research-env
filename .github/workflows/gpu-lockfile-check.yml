name: gpu-lockfile-check

on:
  pull_request:
    paths:
      - environment-gpu.yml
      - conda-lock-gpu.yml
      - scripts/generate-gpu-lockfile.sh
      - scripts/compare_conda_locks.py
      - .github/workflows/gpu-lockfile-check.yml

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-lockfile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CONDA_OVERRIDE_CUDA: "12.4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure runtime paths
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "CANDIDATE_LOCK=${GITHUB_WORKSPACE}/candidate-conda-lock-gpu.yml" \
            >> "${GITHUB_ENV}"

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: "2.8.1-0"
          cache-downloads: true

      - name: Install conda-lock
        shell: bash
        run: |
          set -Eeuo pipefail
          micromamba install \
            -y \
            -n base \
            -c conda-forge \
            "conda-lock=3.0.4"

      - name: Generate candidate GPU lock
        shell: bash
        env:
          CONDA_LOCK_SUBPROCESS_STDERR_LOG_LEVEL_OVERRIDE: INFO
        run: |
          set -Eeuo pipefail
          bash scripts/generate-gpu-lockfile.sh "${CANDIDATE_LOCK}"

      - name: Validate CUDA packages in candidate lock
        shell: bash
        run: |
          set -Eeuo pipefail
          "${MAMBA_EXE}" run -n base python - "${CANDIDATE_LOCK}" <<'PY'
          from pathlib import Path
          import sys

          import yaml

          lock_path = Path(sys.argv[1])
          packages = yaml.safe_load(lock_path.read_text())["package"]

          def selected(name: str) -> list[dict[str, object]]:
              return [
                  package
                  for package in packages
                  if package["platform"] == "linux-64" and package["name"] == name
              ]

          pytorch_cuda = selected("pytorch-cuda")
          if len(pytorch_cuda) != 1 or str(pytorch_cuda[0]["version"]) != "12.4":
              raise SystemExit("GPU lock does not contain pytorch-cuda 12.4")

          for name in ("libxgboost", "py-xgboost"):
              matches = selected(name)
              if len(matches) != 1 or matches[0]["manager"] != "conda":
                  raise SystemExit(f"GPU lock must contain exactly one conda {name} package")

              url = str(matches[0]["url"])
              if "cuda129" not in url or "cpu" in url:
                  raise SystemExit(f"GPU lock selected a non-CUDA-12 {name} package: {url}")

              print(f"CUDA XGBoost package: {url}")

          if selected("xgboost"):
              raise SystemExit("GPU lock must not contain the CPU-oriented xgboost metapackage")

          nccl = selected("nccl")
          if len(nccl) != 1 or "conda-forge" not in str(nccl[0]["url"]):
              raise SystemExit("GPU lock must contain the compatible conda-forge NCCL package")
          print(f"XGBoost NCCL package: {nccl[0]['url']}")
          PY

      - name: Compare canonical GPU lock
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/compare_conda_locks.py \
            conda-lock-gpu.yml \
            "${CANDIDATE_LOCK}"

      - name: Upload candidate GPU lock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-conda-lock-gpu-${{ github.run_id }}
          path: ${{ github.workspace }}/candidate-conda-lock-gpu.yml
          if-no-files-found: ignore
          retention-days: 14
