name: gpu-lockfile-update

on:
  push:
    branches:
      - main
    paths:
      - environment-gpu.yml
      - scripts/generate-gpu-lockfile.sh
      - .github/workflows/gpu-lockfile-update.yml

  schedule:
    - cron: "47 10 * * 1"

  workflow_dispatch:
    inputs:
      commit_lockfile:
        description: "Commit the regenerated GPU lockfile if it changed"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: gpu-lockfile-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure runtime paths
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "CANDIDATE_LOCK=${RUNNER_TEMP}/candidate-conda-lock-gpu.yml" >> "${GITHUB_ENV}"

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: "2.8.1-0"
          cache-downloads: true

      - name: Install conda-lock
        shell: bash
        run: |
          set -Eeuo pipefail
          micromamba install \
            -y \
            -n base \
            -c conda-forge \
            "conda-lock=3.0.4"

      - name: Show solver versions
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Trigger: ${GITHUB_EVENT_NAME}"
          "${MAMBA_EXE}" --version
          "${MAMBA_EXE}" run -n base conda-lock --version

      - name: Generate candidate GPU lock
        id: generate
        continue-on-error: true
        shell: bash
        env:
          CONDA_LOCK_SUBPROCESS_STDERR_LOG_LEVEL_OVERRIDE: INFO
        run: |
          set -Eeuo pipefail

          refresh_args=()
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            refresh_args+=(--refresh)
          fi

          bash scripts/generate-gpu-lockfile.sh \
            "${refresh_args[@]}" \
            "${CANDIDATE_LOCK}"

      - name: Report solve failure
        if: steps.generate.outcome != 'success'
        shell: bash
        run: |
          {
            echo "## GPU lockfile generation failed"
            echo
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
            echo "- The Linux CUDA environment could not be resolved."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error::GPU lockfile generation failed."

      - name: Report GPU lockfile drift
        if: steps.generate.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "## GPU lockfile drift"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ ! -f conda-lock-gpu.yml ]]; then
            echo "**Drift detected:** yes" >> "${GITHUB_STEP_SUMMARY}"
            echo "::warning::No committed conda-lock-gpu.yml exists."
          elif ! cmp -s conda-lock-gpu.yml "${CANDIDATE_LOCK}"; then
            echo "**Drift detected:** yes" >> "${GITHUB_STEP_SUMMARY}"
            echo "::warning::GPU dependency solve produced lockfile drift."
            diff --brief conda-lock-gpu.yml "${CANDIDATE_LOCK}" || true
          else
            echo "**Drift detected:** no" >> "${GITHUB_STEP_SUMMARY}"
            echo "GPU solve matches the committed lockfile."
          fi

      - name: Upload candidate GPU lock
        if: steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: candidate-conda-lock-gpu-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-conda-lock-gpu.yml
          if-no-files-found: error
          retention-days: 14

      - name: Commit and push changed GPU lockfile
        id: commit_lockfile
        if: >
          steps.generate.outcome == 'success' &&
          (
            github.event_name == 'push' ||
            (
              github.event_name == 'workflow_dispatch' &&
              inputs.commit_lockfile
            )
          )
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f conda-lock-gpu.yml ]] || \
             ! cmp -s conda-lock-gpu.yml "${CANDIDATE_LOCK}"; then
            cp "${CANDIDATE_LOCK}" conda-lock-gpu.yml

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add conda-lock-gpu.yml
            git commit -m "Update canonical GPU conda lockfile"
            git push

            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No GPU lockfile changes to commit."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Trigger GPU Docker image workflow
        if: steps.commit_lockfile.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh workflow run docker-image-gpu.yml \
            --ref main \
            -f push_image=true

      - name: Fail workflow if GPU lockfile generation failed
        if: steps.generate.outcome != 'success'
        shell: bash
        run: |
          echo "GPU lockfile generation failed."
          exit 1
