name: docker-image-vllm

on:
  pull_request:
    paths:
      - Dockerfile.vllm
      - vllm-runtime.env
      - scripts/vllm_smoke_test.py
      - .github/workflows/docker-image-vllm.yml

  push:
    branches:
      - main
    paths:
      - Dockerfile.vllm
      - vllm-runtime.env
      - scripts/vllm_smoke_test.py
      - .github/workflows/docker-image-vllm.yml

  workflow_dispatch:
    inputs:
      push_image:
        description: "Publish the vLLM image to GHCR after tests pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-vllm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-image:
    name: Test linux/amd64 vLLM image
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Load vLLM configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          source vllm-runtime.env
          echo "VLLM_VERSION=${VLLM_VERSION}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build vLLM test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.vllm
          load: true
          push: false
          platforms: linux/amd64
          build-args: |
            VLLM_VERSION=${{ env.VLLM_VERSION }}
          tags: ai-research-env:vllm-test
          cache-from: type=gha,scope=docker-vllm-test-amd64
          cache-to: type=gha,mode=max,scope=docker-vllm-test-amd64

      - name: Validate vLLM Python runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --entrypoint python \
            ai-research-env:vllm-test \
            /opt/ai-research-env/vllm_smoke_test.py

      - name: Validate Python dependency consistency
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --entrypoint python \
            ai-research-env:vllm-test \
            -m pip check

      - name: Validate terminal tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            ai-research-env:vllm-test \
            -lc '
              set -e
              git --version
              jq --version
              zsh --version
              /usr/bin/time --version
              /usr/bin/time -v true
            '

  publish-image:
    name: Publish vLLM image
    needs:
      - test-image

    if: >
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.push_image
      )

    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Load vLLM configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          source vllm-runtime.env
          echo "VLLM_VERSION=${VLLM_VERSION}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=vllm
            type=raw,value=vllm-${{ env.VLLM_VERSION }}
            type=sha,prefix=vllm-sha-

      - name: Build and push vLLM image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.vllm
          push: true
          platforms: linux/amd64
          build-args: |
            VLLM_VERSION=${{ env.VLLM_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-vllm-publish-amd64
          cache-to: type=gha,mode=max,scope=docker-vllm-publish-amd64
