name: sync-pr-lockfiles

on:
  pull_request:
    paths:
      - environment.yml
      - environment-gpu.yml
      - .github/workflows/sync-pr-lockfiles.yml

permissions:
  contents: write

concurrency:
  group: sync-pr-lockfiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: "2.8.1-0"
          cache-downloads: true

      - name: Install conda-lock
        shell: bash
        run: |
          set -Eeuo pipefail
          micromamba install \
            -y \
            -n base \
            -c conda-forge \
            "conda-lock=3.0.4"

      - name: Regenerate canonical lockfiles
        shell: bash
        env:
          CONDA_LOCK_SUBPROCESS_STDERR_LOG_LEVEL_OVERRIDE: INFO
        run: |
          set -Eeuo pipefail
          bash scripts/generate-lockfile.sh conda-lock.yml
          bash scripts/generate-gpu-lockfile.sh conda-lock-gpu.yml

      - name: Commit regenerated lockfiles
        shell: bash
        run: |
          set -Eeuo pipefail

          if git diff --quiet -- conda-lock.yml conda-lock-gpu.yml; then
            echo "Canonical lockfiles already match the environment definitions."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conda-lock.yml conda-lock-gpu.yml
          git commit -m "Update canonical conda lockfiles"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
