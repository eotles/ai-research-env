name: lockfile-check

on:
  pull_request:
    paths:
      - environment.yml
      - conda-lock.yml
      - scripts/generate-lockfile.sh
      - scripts/compare_conda_locks.py
      - .github/workflows/lockfile-check.yml
      - .github/workflows/lockfile-update.yml

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockfile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solve:
    name: Solve and verify candidate environment
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure runtime paths
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "CANDIDATE_LOCK=${RUNNER_TEMP}/candidate-conda-lock.yml" \
            >> "${GITHUB_ENV}"

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: "2.8.1-0"
          cache-downloads: true

      - name: Install conda-lock
        shell: bash
        run: |
          set -Eeuo pipefail

          micromamba install \
            -y \
            -n base \
            -c conda-forge \
            "conda-lock=3.0.4"

      - name: Generate compatibility-preserving candidate lock
        shell: bash
        env:
          CONDA_LOCK_SUBPROCESS_STDERR_LOG_LEVEL_OVERRIDE: INFO
        run: |
          set -Eeuo pipefail

          # Seed conda-lock with the committed solution. This verifies that the
          # canonical packages remain compatible with environment.yml without
          # turning unrelated upstream package releases into PR failures.
          cp conda-lock.yml "${CANDIDATE_LOCK}"

          "${MAMBA_EXE}" run -n base conda-lock \
            --conda "${MAMBA_EXE}" \
            --without-cuda \
            --log-level INFO \
            --file environment.yml \
            --kind lock \
            --lockfile "${CANDIDATE_LOCK}"

      - name: Compare canonical portable lock
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/compare_conda_locks.py \
            conda-lock.yml \
            "${CANDIDATE_LOCK}"

      - name: Upload candidate lock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-candidate-conda-lock-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-conda-lock.yml
          if-no-files-found: ignore
          retention-days: 14
